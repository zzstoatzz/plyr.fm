<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<meta name="color-scheme" content="dark light" />
		<title>plyr.fm (next)</title>
		<script>
			// apply stored prefs before first paint (see lib/prefs.svelte.ts)
			try {
				var p = JSON.parse(localStorage.getItem('plyr-next:prefs') || '{}');
				var r = document.documentElement;
				if (p.theme === 'light' || p.theme === 'dark') r.dataset.theme = p.theme;
				if (typeof p.scale === 'number') r.style.fontSize = p.scale * 100 + '%';
				if (typeof p.accent === 'string') r.style.setProperty('--accent', p.accent);
			} catch (e) {}
			// every screen reads the api: open the connection (and wake a scaled-to-zero
			// machine) while the app's javascript is still downloading
			try {
				var api = ('%sveltekit.env.PUBLIC_API_URL%' || 'https://api.next.plyr.fm').replace(/\/$/, '');
				var l = document.createElement('link');
				l.rel = 'preconnect';
				l.href = api;
				l.crossOrigin = '';
				document.head.appendChild(l);
				fetch(api + '/ready', { mode: 'no-cors', cache: 'no-store' }).catch(function () {});
			} catch (e) {}
		</script>
		<style>
			/* the wave: plyr's loading mark. lives here so the boot screen can draw it before any
			   javascript; lib/ui/Loading.svelte uses the same classes. clip-path (not scaleY) keeps
			   the caps perfectly round at every height, so it stays crisp at any size or density. */
			.wave {
				--bar: 0.3125rem;
				--h: 1.75rem;
				display: inline-flex;
				align-items: center;
				gap: calc(var(--bar) * 0.9);
				height: var(--h);
				filter: drop-shadow(0 0 0.5rem color-mix(in srgb, var(--accent, #6a9fff) 30%, transparent));
				animation: wave-in 0.4s 0.18s ease-out both;
			}
			.wave i {
				width: var(--bar);
				height: 100%;
				border-radius: var(--bar);
				background: linear-gradient(
					180deg,
					color-mix(in srgb, var(--accent, #6a9fff) 72%, var(--c-1000, #fff)),
					var(--accent, #6a9fff)
				);
				clip-path: inset(36% 0 round var(--bar));
				animation: wave-bar 1.15s cubic-bezier(0.45, 0, 0.55, 1) infinite;
			}
			.wave i:nth-child(2) { animation-delay: 0.09s; }
			.wave i:nth-child(3) { animation-delay: 0.18s; }
			.wave i:nth-child(4) { animation-delay: 0.27s; }
			.wave i:nth-child(5) { animation-delay: 0.36s; }
			.wave.sm { --bar: 0.1875rem; --h: 1rem; }
			.wave.lg { --bar: 0.4375rem; --h: 2.5rem; }
			@keyframes wave-bar {
				0%, 100% { clip-path: inset(36% 0 round var(--bar)); opacity: 0.55; }
				50% { clip-path: inset(0 0 round var(--bar)); opacity: 1; }
			}
			@keyframes wave-in {
				from { opacity: 0; transform: translateY(0.25rem); }
			}
			@media (prefers-reduced-motion: reduce) {
				/* a still waveform instead of motion */
				.wave i { animation: none; opacity: 0.85; }
				.wave i:nth-child(1), .wave i:nth-child(5) { clip-path: inset(30% 0 round var(--bar)); }
				.wave i:nth-child(2), .wave i:nth-child(4) { clip-path: inset(12% 0 round var(--bar)); }
				.wave i:nth-child(3) { clip-path: inset(0 0 round var(--bar)); }
			}

			#boot {
				position: fixed;
				inset: 0;
				display: grid;
				place-items: center;
				background: #fff;
			}
			@media (prefers-color-scheme: dark) {
				:root:not([data-theme='light']) #boot { background: #000; }
			}
			:root[data-theme='dark'] #boot { background: #000; }
			/* gone the moment the app shell renders; no script needed */
			body:has(#main) #boot { display: none; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="boot" role="status" aria-label="loading plyr.fm">
			<span class="wave lg" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
