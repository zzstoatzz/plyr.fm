# Next's upload processing executor. Owned by Next; production never deploys it.
app = "plyr-next-processing"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  NEXT_PROCESSING_ORIGIN = "https://plyr-next-audio.n8-3e9.workers.dev"

# An attempt runs for minutes after its single inbound request, with only
# outbound traffic, so Fly must not stop the machine for idleness.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 8
    hard_limit = 16

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
