# Disposable services for the Zig backend's tests and benchmarks only.
services:
  zig-db:
    image: postgres:16-alpine
    ports:
      - "5435:5432"
    environment:
      POSTGRES_USER: zig_test
      POSTGRES_PASSWORD: zig_test
      POSTGRES_DB: zig_test
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=100"]

  bench-db:
    image: postgres:16-alpine
    profiles: [bench]
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: zig_bench
      POSTGRES_PASSWORD: zig_bench
      POSTGRES_DB: zig_bench
    tmpfs:
      - /var/lib/postgresql/data
    command: ["postgres", "-c", "max_connections=100"]

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    command: redis-server --appendonly no --save ""
