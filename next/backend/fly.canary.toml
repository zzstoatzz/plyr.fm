app = "plyr-api-zig-canary"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

# One image, two process groups. The binary ignores argv; the group name
# (FLY_PROCESS_GROUP) selects the role: `app` runs MODE=api with one warm machine;
# `ingester` runs the jetstream-to-projection ingester (WORKER_DATABASE_URL) and,
# when MIRROR_BASE_URL + MIRROR_UPLOAD_TOKEN are set, the blob mirror on a side thread.
[processes]
  app = "serve"
  ingester = "ingester"
  # follows every plyr space on the space-stream as the plyr.fm account
  space_consumer = "space_consumer"

[env]
  CORS_ALLOWED_ORIGINS = "https://next.plyr.fm,https://plyr-fm-next.pages.dev,http://127.0.0.1:5174"
  DATABASE_ROLE = "plyr_zig_canary"
  # one connection opens before the api binds (each Neon connect is ~1s);
  # the rest connect in the background after it's serving.
  DATABASE_POOL_SIZE = "4"
  INGEST_STREAM_HOSTS = "stream.waow.tech,jetstream1.us-east.bsky.network,jetstream2.us-east.bsky.network,jetstream1.us-west.bsky.network,jetstream2.us-west.bsky.network"
  INDEX_MODE = "required"
  LIST_COLLECTION_NSID = "fm.plyr.list"
  LIKE_COLLECTION_NSID = "fm.plyr.like"
  COMMENT_COLLECTION_NSID = "fm.plyr.comment"
  PROFILE_COLLECTION_NSID = "fm.plyr.actor.profile"
  MAX_CONNECTIONS = "128"
  MODE = "api"
  PORT = "8000"
  TRACK_COLLECTION_NSID = "fm.plyr.track"
  # plyr manages gated-audio spaces as did:web:api.next.plyr.fm#plyr_space
  SPACE_SERVICE_DID = "did:web:api.next.plyr.fm"
  SPACE_SERVICE_ENDPOINT = "https://api.next.plyr.fm"
  SPACE_TYPE_NSID = "fm.plyr.next.audio"
  # the plyr.fm account reads plyr spaces through plyr's space-stream
  # (next/services/space-stream); its app password is SPACE_SYNC_APP_PASSWORD
  SPACE_SYNC_DID = "did:plc:vs3hnzq2daqbszxlysywzy54"
  SPACE_SYNC_HANDLE = "plyr.fm"
  SPACE_SYNC_PDS = "https://chalciporus.us-west.host.bsky.network"
  SPACE_STREAM_HOST = "plyr-space-stream.n8-3e9.workers.dev"
  # catalog bootstrap: every repo the relay has seen write fm.plyr.*
  CATALOG_DISCOVERY_RELAY = "https://relay1.us-east.bsky.network"

[http_service]
  processes = ["app"]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 96
    hard_limit = 128

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/ready"

[[restart]]
  policy = "always"
  processes = ["ingester", "space_consumer"]

[[vm]]
  processes = ["app"]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"

[[vm]]
  processes = ["ingester"]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"

[[vm]]
  processes = ["space_consumer"]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
