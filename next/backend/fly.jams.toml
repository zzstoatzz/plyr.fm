app = "plyr-jams-next"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  MODE = "jams"
  UPLOAD_PROCESSING_ENABLED = "true"
  PORT = "8000"
  INDEX_MODE = "disabled"
  CORS_ALLOWED_ORIGINS = "https://next.plyr.fm,https://plyr-fm-next.pages.dev"
  TRACK_COLLECTION_NSID = "fm.plyr.track"
  LIST_COLLECTION_NSID = "fm.plyr.list"
  LIKE_COLLECTION_NSID = "fm.plyr.like"
  PROFILE_COLLECTION_NSID = "fm.plyr.actor.profile"
  JAM_SERVICE_AUDIENCE = "did:web:plyr-jams-next.fly.dev#jams"
  JAM_JOIN_METHOD = "fm.plyr.stg.jam.join"
  SPACE_TYPE_NSID = "fm.plyr.stg.audio"
  JAM_SPACE_TYPE = "fm.plyr.stg.jam"
  MAX_CONNECTIONS = "128"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 2

  [http_service.concurrency]
    type = "connections"
    soft_limit = 96
    hard_limit = 128

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
