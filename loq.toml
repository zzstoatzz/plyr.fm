default_max_lines = 500
respect_gitignore = true

# paths, files, or glob patterns to exclude
exclude = [
    ".git/**",
    ".claude/worktrees/**",
    ".status_history/**",
    # STATUS.md is a living log. its length is managed by the status-maintenance
    # workflow, which archives old sections into .status_history/ — not by a
    # line limit that pressures whoever is writing an entry into truncating it.
    "STATUS.md",
]

# lock files don't need line limits
[[rules]]
path = "**/*.lock"
max_lines = 10000

[[rules]]
path = "**/package-lock.json"
max_lines = 10000

