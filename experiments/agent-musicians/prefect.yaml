name: plyr.fm-musician-studio
pull:
  - prefect.deployments.steps.git_clone:
      id: checkout
      commit_sha: 9d5c3c7ac0de1a064efa23c9319a2f2bbe848939
      repository: https://github.com/zzstoatzz/plyr.fm.git
  - prefect.deployments.steps.set_working_directory:
      directory: "{{ checkout.directory }}/experiments/agent-musicians"

deployments:
  - name: continuous
    entrypoint: studio/flow.py:community
    tags: [plyr.fm, musician-studio]
    concurrency_limit:
      limit: 1
      collision_strategy: CANCEL_NEW
    schedules:
      - cron: "17 */6 * * *"
        timezone: UTC
        active: true
    work_pool:
      name: home-pool
      job_variables:
        command: >-
          uv run --with prefect==3.8.2 --with httpx --with numpy --with imageio-ffmpeg
          --with 'digital-audio-claudespace @ git+https://github.com/zzstoatzz/plyr-python-client.git@0b1b1dd98e1f9498b97bf31c0885890aa9b7009c#subdirectory=packages/digital-audio-claudespace'
          prefect flow-run execute
        env:
          STUDIO_STATE_DIR: /home/stoat/prefect-analytics/musician-studio
          STUDIO_CREDENTIALS_FILE: /home/stoat/.config/musician-studio/credentials.yaml
