name: interface contracts

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  interfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: zzstoatzz/plyr-python-client
          path: .client-source
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
      - name: Export and check the current API contract
        env:
          OAUTH_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: uv run --directory backend python ../scripts/check_client_contract.py --export /tmp/plyr-openapi.json
      - name: Check current SDK against this backend
        working-directory: .client-source
        run: |
          uv run python scripts/check_api_contract.py --schema /tmp/plyr-openapi.json
          uv run pytest tests/test_client_parity.py tests/test_surface_inventory.py tests/test_read_parity.py tests/test_mcp_header_auth.py tests/test_api_contract.py tests/test_download_policy.py -q
          uv run python scripts/render_surfaces.py --check
