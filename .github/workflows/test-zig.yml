name: zig backend tests

# Builds and tests next/backend only. Runs against disposable service
# containers; it has no deploy step and no credentials.
on:
  pull_request:
    paths:
      - "next/backend/**"
      - "backend/src/backend/upload_contract.json"
      - ".github/workflows/test-zig.yml"
  # nightly: the mutants job proves the property harnesses still catch every
  # planted bug in src/fuzz/mutants.zon
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: zig build + test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zig_test
          POSTGRES_PASSWORD: zig_test
          POSTGRES_DB: zig_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U zig_test -d zig_test"
          --health-interval 2s --health-timeout 5s --health-retries 30
      redis:
        image: redis:7
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s --health-timeout 5s --health-retries 30

    defaults:
      run:
        working-directory: next/backend

    steps:
      - uses: actions/checkout@v4

      - name: install zig 0.17.0
        run: |
          python3 -m pip install --user ziglang==0.17.0
          ln -s "$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')/zig" /usr/local/bin/zig || sudo ln -s "$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')/zig" /usr/local/bin/zig
          zig version

      # every dependency is a tangled.org archive; keep the fetched packages
      # so a tangled outage cannot fail a build whose deps have not changed
      - uses: actions/cache@v4
        with:
          path: next/backend/zig-pkg
          key: zig-pkg-${{ hashFiles('next/backend/build.zig.zon') }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: install openssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: fmt
        run: zig fmt --check build.zig src

      - name: build
        run: scripts/fetch-interop-fixtures && zig build

      - name: test (with postgres + redis)
        env:
          PLYR_ZIG_TEST_DATABASE_URL: postgresql://zig_test:zig_test@127.0.0.1:5435/zig_test
          PLYR_ZIG_TEST_REDIS_URL: redis://127.0.0.1:6380/0
        run: zig build test

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install uv
        uses: astral-sh/setup-uv@v7

      - name: http contract smoke
        run: uv run --no-project python scripts/test_http.py

      # the zig schema sits on top of the python backend's public schema, so
      # build that first on a separate marked database, then apply ours twice
      # (the second run must be a no-op).
      - name: migrations apply on top of the python schema
        env:
          PGPASSWORD: zig_test
          DATABASE_URL: postgresql://zig_test:zig_test@127.0.0.1:5435/next_ci
        run: |
          psql -h 127.0.0.1 -p 5435 -U zig_test -d zig_test -c "CREATE DATABASE next_ci"
          psql -h 127.0.0.1 -p 5435 -U zig_test -d zig_test -c "COMMENT ON DATABASE next_ci IS 'plyr-zig-test'"
          (cd ../../backend && uv sync --locked && DATABASE_URL=postgresql+psycopg://zig_test:zig_test@127.0.0.1:5435/next_ci uv run python scripts/init_db.py)
          scripts/migrate
          scripts/migrate | grep -q "applied 0 migration"

      - name: refuses an unmarked database
        env:
          DATABASE_URL: postgresql://zig_test:zig_test@127.0.0.1:5435/zig_test
        run: |
          if scripts/migrate; then echo "migrate ran against an unmarked database" >&2; exit 1; fi

      - name: durable play HTTP contract
        working-directory: backend
        run: uv run python ../next/backend/scripts/test_play_http.py

      - name: supporter download authorization HTTP contract
        run: node scripts/test-download-authorization.cjs

      - name: upload admission HTTP contract
        run: node scripts/test-upload-admission.cjs

      - name: stale connection read HTTP contract
        working-directory: backend
        run: uv run python ../next/backend/scripts/test_read_http.py

      - name: discovery label and preference HTTP contract
        working-directory: backend
        run: uv run python ../next/backend/scripts/test_discovery_http.py

      - name: Python canary and benchmark contract checks
        working-directory: backend
        run: |
          uv run ruff check ../next/backend/scripts
          uv run pytest -q ../next/backend/scripts/test_bench_http.py ../next/backend/scripts/test_bench_api_parity.py ../next/backend/scripts/test_canary_placement.py ../next/backend/scripts/test_canary_reconcile.py ../next/backend/scripts/test_canary_report.py ../next/backend/scripts/test_canary_smoke.py

  fuzz:
    name: zig property harnesses
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # the like-count property runs the migration's triggers against this
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zig_test
          POSTGRES_PASSWORD: zig_test
          POSTGRES_DB: zig_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U zig_test -d zig_test"
          --health-interval 2s --health-timeout 5s --health-retries 30

    defaults:
      run:
        working-directory: next/backend

    steps:
      - uses: actions/checkout@v4

      - name: install zig 0.17.0
        run: |
          python3 -m pip install --user ziglang==0.17.0
          ln -s "$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')/zig" /usr/local/bin/zig || sudo ln -s "$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')/zig" /usr/local/bin/zig
          zig version

      - name: install openssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # every dependency is a tangled.org archive; keep the fetched packages
      # so a tangled outage cannot fail a build whose deps have not changed
      - uses: actions/cache@v4
        with:
          path: next/backend/zig-pkg
          key: zig-pkg-${{ hashFiles('next/backend/build.zig.zon') }}

      # libhegel is a cargo build of one pinned hegel-rust revision
      - uses: actions/cache@v4
        with:
          path: ~/.cache/hegel-zig
          key: hegel-zig-${{ hashFiles('next/backend/build.zig.zon') }}

      - name: property harnesses
        env:
          PLYR_ZIG_TEST_DATABASE_URL: postgresql://zig_test:zig_test@127.0.0.1:5435/zig_test
        run: scripts/fetch-interop-fixtures && zig build fuzz -Dhegel -Dfuzz-cases=500

  mutants:
    name: zig property harnesses catch every mutant
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: zig_test
          POSTGRES_PASSWORD: zig_test
          POSTGRES_DB: zig_test
        ports:
          - 5435:5432
        options: >-
          --health-cmd "pg_isready -U zig_test -d zig_test"
          --health-interval 2s --health-timeout 5s --health-retries 30

    defaults:
      run:
        working-directory: next/backend

    steps:
      - uses: actions/checkout@v4

      - name: install zig 0.17.0
        run: |
          python3 -m pip install --user ziglang==0.17.0
          ln -s "$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')/zig" /usr/local/bin/zig || sudo ln -s "$(python3 -c 'import ziglang, os; print(os.path.dirname(ziglang.__file__))')/zig" /usr/local/bin/zig
          zig version

      - name: install openssl headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      # every dependency is a tangled.org archive; keep the fetched packages
      # so a tangled outage cannot fail a build whose deps have not changed
      - uses: actions/cache@v4
        with:
          path: next/backend/zig-pkg
          key: zig-pkg-${{ hashFiles('next/backend/build.zig.zon') }}

      - uses: actions/cache@v4
        with:
          path: ~/.cache/hegel-zig
          key: hegel-zig-${{ hashFiles('next/backend/build.zig.zon') }}

      - name: plant each mutant
        env:
          PLYR_ZIG_TEST_DATABASE_URL: postgresql://zig_test:zig_test@127.0.0.1:5435/zig_test
          # the PR job's case count; at the default 100 some mutants slip a seed
          HEGEL_TEST_CASES: "500"
        run: scripts/fetch-interop-fixtures && zig build mutants -Dhegel
