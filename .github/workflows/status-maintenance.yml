# status maintenance via claude code
#
# two-phase workflow:
# 1. workflow_dispatch: archives old STATUS.md sections, generates audio, opens PR
# 2. on PR merge: uploads audio to plyr.fm
#
# required secrets:
#   ANTHROPIC_API_KEY - claude code
#   GOOGLE_API_KEY - gemini TTS (for audio generation)
#   PLYR_BOT_TOKEN - plyr.fm developer token (for audio upload)

name: status maintenance

# the model is named once here so the PR body can say which one wrote the run
env:
  STATUS_MODEL: claude-opus-5

on:
  schedule:
    # mondays 14:00 UTC (9am central): archive, podcast, PR — a human still merges
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      skip_audio:
        description: "skip audio generation"
        type: boolean
        default: false
      report_only:
        description: "print the window report to the job log and stop (no Claude, no PR)"
        type: boolean
        default: false
      window_since:
        description: "override the window start (ISO time) — for reruns and evaluating the process against a past window"
        type: string
        default: ""
      research_only:
        description: "stop after the ecosystem research (no writer, no PR); read ecosystem_context.md from the job summary or artifact"
        type: boolean
        default: false
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  # phase 1: archive + generate audio + open PR
  maintain:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7

      # the report is deterministic, so it is built here where its output is
      # in the job log and the Cloudflare secrets never enter the Claude step
      - name: Generate the window report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "${{ inputs.window_since }}" ]; then
            uv run scripts/status_window.py --since "${{ inputs.window_since }}" > window_report.md
          else
            uv run scripts/status_window.py > window_report.md
          fi
          cat window_report.md

      # the research is its own Claude invocation so it finishes, in order,
      # before the writer starts — a background subagent inside the writer's
      # run was abandoned when the writer ended its turn (run 33936254221)
      - name: Ecosystem research
        uses: anthropics/claude-code-action@v1
        id: research
        if: ${{ !inputs.report_only }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: |
            --model ${{ env.STATUS_MODEL }}
            --mcp-config .github/mcp/status-maintenance.json
            --allowedTools "Read,Write,Bash,mcp__pub-search__search,mcp__pub-search__get_document,mcp__pub-search__find_similar,mcp__pub-search__author_profile"
          prompt: |
            you are the research half of the plyr.fm status-maintenance run. your ENTIRE purpose is to find the atmosphere writing that plyr.fm's recent changes respond to, and write it into `ecosystem_context.md` in the repository root. you edit nothing else and open no PR.

            why: changes in this app are usually precipitated by changes in the atmosphere that show up first as long-form writing — protocol proposals, other apps' release notes, essays. pub-search indexes that writing across leaflet, pckt, offprint, greengale, whitewind and independent sites. its tools: `search` (with `since` and `author` filters; `since` applies in keyword mode and to the keyword half of hybrid), `get_document`, `find_similar`, `author_profile`.

            1. read `window_report.md` (its first line gives the window start) and the "current focus" section of `STATUS.md`.
            2. write 3–6 seed topics: the subjects of the window's significant PRs and the protocol or ecosystem terms they touch (for example "atproto spaces / permissioned data", "jetstream firehose delivery", "media player conventions").
            3. for each seed, in order, one call at a time — the index is a small shared service, so never issue searches in parallel; if a call returns a 502, wait five seconds and retry once, then move on:
               - `search`, mode keyword, `since` = the window start, limit 8
               - `search`, mode hybrid, no `since`, limit 8, for the background the window's work responds to
               - `get_document` for the 2–3 most promising hits, and read them
            4. the bar for keeping a document is that it bears on a specific change in the window (a PR in the report) or on an item in current focus: it describes the thing plyr built or fixed, the protocol feature it uses, or the same problem solved by another app. a document that merely shares words with a seed, or is about the atmosphere in general, does not clear the bar. everything that does not clear it is thrown away without a trace.
            5. write `ecosystem_context.md`: only the documents that cleared the bar, grouped by the change or focus item they bear on — for each, title, publication or author, date, URL, whether it was published in the window or earlier, and two sentences: what it says, and which change it bears on. at most ~12 documents. cite only documents you actually read with `get_document`; never infer content from a title or snippet.

            the file contains findings and nothing else: no seed list, no method notes, no mention of searches that failed, of hits you discarded, or of topics that turned up nothing — a topic with nothing relevant is simply absent. the writer must not be told what to ignore. if nothing at all cleared the bar, write a one-line file saying there is no ecosystem context for this window.

            when the file is written, you are done. do not summarize it back; the writer reads the file.

      - name: Collect the research execution file
        if: ${{ !inputs.report_only && always() }}
        run: |
          if [ -n "${{ steps.research.outputs.execution_file }}" ] && [ -f "${{ steps.research.outputs.execution_file }}" ]; then
            cp "${{ steps.research.outputs.execution_file }}" claude-research-execution.json
          fi
          ls -la ecosystem_context.md 2>/dev/null || echo "research wrote no ecosystem_context.md"

      - uses: anthropics/claude-code-action@v1
        id: claude
        if: ${{ !inputs.report_only && !inputs.research_only }}
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          display_report: "true"
          claude_args: |
            --model ${{ env.STATUS_MODEL }}
            --allowedTools "Read,Write,Edit,Bash,Fetch,Task"
          prompt: |
            you are maintaining the plyr.fm (pronounced "player FM") project status file.

            ## critical rules

            1. STATUS.md MUST be kept under 500 lines. this is non-negotiable.
            2. archive content MUST be moved to .status_history/, not deleted
            3. podcast tone MUST be dry, matter-of-fact, slightly sardonic - NOT enthusiastic or complimentary

            ## task 1: gather the window report

            the window is from the moment the LAST status-maintenance PR was MERGED (not opened) until now — unless the report's first line says the start was given, in which case someone chose the window deliberately (a rerun or an evaluation) and you cover it even if STATUS.md already documents that work. `scripts/status_window.py` computed it before you started and wrote `window_report.md` into the working directory. run:

            ```bash
            date
            git log --oneline -50
            ```

            then read window_report.md in full. it is the ground truth for this run and contains:
            - the window and which maintenance PR opened it
            - backend releases (GitHub releases, timestamp tags) published in the window and the PRs each carried to production
            - frontend promotes — Cloudflare Pages production deployments of `production-fe`, the only record a frontend-only release leaves
            - every PR merged in the window with a `landed` column: `prod via release <tag>`, `prod via frontend promote <time>`, `staging only`, or `docs only`
            - public posts in the window from the plyr.fm account, and from zzstoatzz.io where they mention plyr
            - project scope: first commit, release count, STATUS.md's line count, and the arcs already archived in .status_history/ (titles for the newest months; read the older files when you need them)

            IMPORTANT: if the last PR was merged on Dec 2nd and today is Dec 8th, the window is Dec 2nd onwards, NOT "the last week".

            ## how to use the report

            - **the subject is the diff.** the episode and the STATUS.md changes are about what changed in the window. the releases, promotes, posts and archived arcs are context for placing that work, never a list to recite — a recap of releases is duplicative of the release page.
            - **the `landed` column decides tense.** "shipped", "launched", "live" and "in production" are only for rows landed in prod, and the first mention names when (the release or promote date). a row that is `staging only` is "merged" or "on staging", however confident its PR body sounds. never say "shipped" from a merge date.
            - **the posts are what the audience was told.** when a change was announced, one clause noting it is enough; when a significant change went out unannounced, say so once. do not read posts aloud.
            - **the archived arcs are the project's memory.** use them to place the window — what this continues, what it closes, what it reverses — one phrase at a time, and only where a listener with no history would otherwise be lost.
            - **STATUS.md must agree with the report.** if STATUS.md calls something shipped that the report shows as `staging only`, or the reverse, correct STATUS.md in this PR and say so in the PR body.

            ## task 1b: ecosystem context

            changes in this app are usually precipitated by changes in the atmosphere that show up first as long-form writing — protocol proposals, other apps' release notes, essays. a research run finished before you started: it seeded 3–6 topics from the window report and STATUS.md's current focus, searched the pub-search index of long-form atmosphere writing for each (filtered to the window, plus background), read the top hits, and wrote `ecosystem_context.md` in the working directory — per seed, the documents that bear on it, with title, publication, date, URL and two sentences on the relation.

            read ecosystem_context.md if it exists (the research run can fail; then there is simply no context this week). it contains only writing that bears on the window's changes, grouped by change. use it the same way as the posts: where a change in the window responds to something written in the atmosphere, one clause naming the publication is enough ("after Habitat's write-up on organizational spaces…"); the findings are never a segment of their own, and neither the transcript nor STATUS.md ever says what was not found or not relevant. keep the file in place — a later step posts it into the PR body so a reviewer can judge what was found.

            ## task 2: archive old month sections

            **line count targets**:
            - ideal: ~200 lines (concise overview)
            - acceptable: 300-450 lines
            - maximum: 500 lines (MUST NOT exceed)

            **when to archive**: if STATUS.md > 400 lines OR contains detailed sections from previous months

            **what to archive**: content from months BEFORE the current month
            - if today is January 2026, move December 2025 sections to .status_history/2025-12.md
            - if today is February 2026, move January 2026 sections to .status_history/2026-01.md
            - current month content stays in STATUS.md

            **how to archive** (this means MOVING content, not summarizing):
            1. create .status_history/ directory if it doesn't exist
            2. identify "### Month Year" sections from previous months in STATUS.md
            3. CUT the full section content (headers, bullet points, everything)
            4. PASTE/APPEND to .status_history/YYYY-MM.md
               - if archive file exists: append to end of file
               - if archive file doesn't exist: create with header "# plyr.fm Status History - Month Year"
            5. REPLACE the moved section in STATUS.md with a brief cross-reference:
               ```
               ### December 2025

               See `.status_history/2025-12.md` for detailed history.
               ```
            6. preserve document structure (keep "## recent work", "## priorities", "## technical state" headers)

            CRITICAL: "archiving" = moving actual content to archive files, NOT condensing or summarizing in place.
            the detailed write-ups must be preserved in .status_history/, not deleted.

            VERIFY: run `wc -l STATUS.md` after archiving. target 300-450 lines, must be under 500.

            ## task 3: generate audio overview (if skip_audio is false)

            skip_audio input: ${{ inputs.skip_audio }}

            if skip_audio is false:

            ### deep investigation phase

            before writing anything, you need to deeply understand what happened in the time window.
            use subagents liberally to investigate in parallel:

            1. **start from the PR table in window_report.md** — it lists every PR merged in the window and where each landed. read bodies with `gh pr view {number} --json body` for the ones that matter:

            2. **for each significant PR, read its body and understand the design decisions**:
               - what problem was being solved?
               - what approach was taken and why?
               - what are the key files changed?

            3. **read the actual code changes** for the top 2-3 most significant PRs:
               - use `gh pr diff {number}` or read the changed files directly
               - understand the architecture, not just the commit messages

            4. **read background context**:
               - STATUS.md (the current state)
               - docs/deployment/overview.md if it exists
               - Fetch https://atproto.com/guides/overview to understand ATProto primitives
               - Fetch https://atproto.com/guides/lexicon to understand NSIDs and lexicons

            ### identify the narrative structure

            after investigating, categorize what shipped:

            **big ticket items** (1-3 major features or architectural changes):
            - these get the most airtime (60-70% of the script)
            - explain HOW they were designed, not just WHAT they do
            - discuss interesting technical decisions or tradeoffs

            **smaller but notable changes** (3-6 fixes, improvements, polish):
            - these get rapid-fire coverage (20-30% of the script)
            - one or two sentences each
            - acknowledge they happened without belaboring them

            ### write the podcast script

            write to podcast_script.txt with "Host: ..." and "Cohost: ..." lines.

            **CHRONOLOGICAL NARRATIVE STRUCTURE** (CRITICAL):

            the script must tell a coherent story of the time period, structured as:

            1. **opening** (10 seconds): set the scene - what's the date range, what was the focus?

            2. **the main story** (60-90 seconds): the biggest thing that shipped
               - what problem did it solve?
               - how was it designed? (explain the architecture accessibly)
               - what's interesting about the implementation?
               - the hosts should have a back-and-forth discussing the design

            3. **secondary feature** (30-45 seconds, if applicable): another significant change
               - lighter treatment than the main story
               - still explain the "why" not just the "what"

            4. **rapid fire** (20-30 seconds): the smaller changes
               - "we also saw..." or "a few other things landed..."
               - quick hits: bug fixes, polish, minor improvements
               - don't dwell, just acknowledge

            5. **closing** (10 seconds): looking ahead or wrapping up

            the narrative should flow like you're telling a friend what happened on the project this week.
            use transitions: "but before that landed...", "meanwhile...", "and then to tie it together..."

            ### tone requirements (CRITICAL)

            the hosts should sound like two engineers who:
            - are skeptical, amused and somewhat intrigued by the absurdity of building things
            - acknowledge problems and limitations honestly
            - don't over-use superlatives ("amazing", "incredible", "exciting")
            - explain technical concepts through analogy, not hypey jargon
            - genuinely find the technical details interesting (not performatively enthusiastic)

            avoid excessive phrasing:
            - "exciting", "amazing", "incredible", "impressive", "great job"
            - "the team has done", "they've really", "fantastic work"
            - any variation of over-congratulating or over-sensationalizing the project

            ### pronunciation (CRITICAL - READ THIS CAREFULLY)

            the project name "plyr.fm" is pronounced "player FM" (like "music player").

            **in your script, ALWAYS write "player FM" or "player dot FM" - NEVER write "plyr.fm" or "plyr".**

            the TTS engine will mispronounce "plyr" as "plir" or "p-l-y-r" if you write it that way.
            write phonetically for correct pronunciation: "player FM", "player dot FM".

            ### terminology

            plyr.fm is built on **ATProto** (the protocol), not Bluesky (the app).
            say "atmosphere accounts" or just "accounts" - never "Bluesky accounts".

            ### identifying what actually shipped

            read the commit messages and PR bodies carefully to understand what changed.

            - "shipped" and "launched" mean the `landed` column in window_report.md says prod; a merged PR that is `staging only` is not shipped, whatever its body says
            - if something is completely NEW (didn't exist before) and is in prod, say it "shipped" or "launched"
            - if something existing got improved or fixed, call it what it is: fixes, improvements, polish

            don't rely on commit message prefixes like `feat:` or `fix:` - they're not always accurate.
            read the actual content to understand the scope of what changed.

            ### time references (CRITICAL)

            NEVER say "last week", "this week", "recently", or vague time references.

            ALWAYS use specific date ranges based on the mergedAt date from task 1:
            - "since December 2nd" or "from December 3rd to today"
            - "in the past six days" (if that's accurate)
            - "since the last update"

            the listener doesn't know when "last week" was - be specific.

            target length: 2-3 minutes spoken (~300-400 words) (it should be 4-5 if its the first episode)

            ### generate audio

            run: uv run scripts/generate_tts.py podcast_script.txt update.wav

            keep podcast_script.txt, window_report.md and ecosystem_context.md
            in place — do NOT delete them. a later workflow step posts the
            report, the ecosystem context and the transcript into the PR body
            and uploads update.wav and podcast_script.txt as a build artifact
            so the phase-2 upload job can attach the transcript as the track
            description. none of these files is committed to the repo (all
            are gitignored).

            ## task 4: open PR

            if any files changed:
            1. first, generate a unique branch name: BRANCH="status-maintenance-$(date +%Y%m%d-%H%M%S)"
            2. git checkout -b $BRANCH
            3. git add .status_history/ STATUS.md
               (do NOT add update.wav, podcast_script.txt, window_report.md or
               ecosystem_context.md — they are gitignored; the audio and
               transcript are carried to phase 2 as a build artifact instead)
            4. git commit -m "chore: status maintenance"
            5. git push -u origin $BRANCH
            6. gh pr create with a title and body you craft:
               - title should be descriptive of what this status update covers (e.g. "chore: status maintenance - playlist fast-follow fixes" or "chore: status maintenance - December updates")
               - make it clear this is an automated status maintenance PR from the GitHub Action
               - body should summarize what changed (archival, audio generation, etc.)

            add a label like "ai-generated" to the PR (create the label if it doesn't exist)
            if nothing changed, report that no maintenance was needed.

        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}

      # carry the generated audio + transcript to phase 2 (the merge run is a
      # separate run with a fresh checkout, so it can't see these files
      # otherwise). neither is committed to the repo.
      #
      # the artifact name encodes the PR branch claude just created and pushed:
      # this run was dispatched on main, so its run-level branch/sha point at
      # main — the only durable join to the merge run is the branch name, which
      # phase 2 reads from the merged PR's head ref.
      # the run's outputs are reviewable even when it opened no PR: they go to
      # the job summary and an artifact named by run id
      - name: Publish run outputs
        if: ${{ !inputs.report_only }}
        run: |
          for f in window_report.md ecosystem_context.md podcast_script.txt; do
            if [ -f "$f" ]; then
              { printf '## %s\n\n' "$f"; if [ "$f" = podcast_script.txt ]; then printf '```\n'; cat "$f"; printf '\n```\n'; else cat "$f"; fi; printf '\n\n'; } >> "$GITHUB_STEP_SUMMARY"
            else
              printf '## %s\n\nnot produced by this run\n\n' "$f" >> "$GITHUB_STEP_SUMMARY"
            fi
          done

      # the execution file is the full Claude transcript (every tool call and
      # result) — the only way to see what a run that opened no PR actually did
      - name: Collect the Claude execution file
        if: ${{ !inputs.report_only && always() }}
        run: |
          if [ -n "${{ steps.claude.outputs.execution_file }}" ] && [ -f "${{ steps.claude.outputs.execution_file }}" ]; then
            cp "${{ steps.claude.outputs.execution_file }}" claude-execution.json
          fi

      - name: Upload run outputs artifact
        if: ${{ !inputs.report_only && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: status-run-outputs-${{ github.run_id }}
          path: |
            window_report.md
            ecosystem_context.md
            podcast_script.txt
            claude-execution.json
            claude-research-execution.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Resolve PR branch
        if: ${{ !inputs.report_only && !inputs.research_only }}
        id: prbranch
        run: echo "branch=$(git branch --show-current)" >> "$GITHUB_OUTPUT"

      # the reviewer needs the window report (what landed where, what was
      # posted) to check the transcript's claims, and the transcript itself
      # (the audio only uploads after the merge), so both go in the PR body
      - name: Post the window report, ecosystem context and transcript to the PR
        if: startsWith(steps.prbranch.outputs.branch, 'status-maintenance-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.prbranch.outputs.branch }}
        run: |
          if ! BODY=$(gh pr view "$BRANCH" --json body --jq .body 2>/dev/null); then
            echo "no PR for $BRANCH (the run opened none); outputs are in the job summary and artifact"
            exit 0
          fi
          {
            printf '%s\n\nwritten by `%s` (claude-code-action).\n' "$BODY" "$STATUS_MODEL"
            if [ -f window_report.md ]; then
              printf '\n<details>\n<summary>window report — what landed where, what was posted</summary>\n\n'
              cat window_report.md
              printf '\n\n</details>\n'
            fi
            if [ -f ecosystem_context.md ]; then
              printf '\n<details>\n<summary>ecosystem context — what the atmosphere wrote (pub-search)</summary>\n\n'
              cat ecosystem_context.md
              printf '\n\n</details>\n'
            fi
            if [ -f podcast_script.txt ]; then
              printf '\n<details>\n<summary>podcast transcript</summary>\n\n```\n'
              cat podcast_script.txt
              printf '\n```\n\n</details>\n'
            fi
          } > pr-body.md
          gh pr edit "$BRANCH" --body-file pr-body.md

      - name: Upload audio + transcript artifact
        uses: actions/upload-artifact@v4
        with:
          name: status-audio-${{ steps.prbranch.outputs.branch }}
          path: |
            update.wav
            podcast_script.txt
          if-no-files-found: ignore
          retention-days: 7

  # phase 2: upload audio after PR merge
  upload-audio:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'status-maintenance-')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read + download the phase-1 build artifact

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      # the audio + transcript live on the phase-1 run, not in the repo. that
      # run was dispatched on main, so we can't find it by branch — instead we
      # look up the artifact by name (it encodes the PR branch) and download it
      # from its owning run.
      - name: Fetch audio + transcript from phase-1 run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ARTIFACT: status-audio-${{ github.event.pull_request.head.ref }}
        run: |
          RUN_ID=$(gh api \
            "repos/${{ github.repository }}/actions/artifacts?per_page=100" \
            --jq "[.artifacts[] | select(.name==\"$ARTIFACT\" and .expired==false)] | sort_by(.created_at) | reverse | .[0].workflow_run.id")

          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No '$ARTIFACT' artifact found (audio was likely skipped), nothing to upload"
            exit 0
          fi

          echo "Downloading $ARTIFACT from run $RUN_ID"
          gh run download "$RUN_ID" --name "$ARTIFACT" --dir .

      - name: Upload audio to plyr.fm
        run: |
          if [ ! -f update.wav ]; then
            echo "No update.wav found, skipping upload"
            exit 0
          fi

          # check existing tracks to determine episode number
          EXISTING=$(uv run --with "plyrfm>=0.0.1a21" -- plyrfm tracks my --limit 50 2>/dev/null || echo "")
          TODAY=$(date +'%B %d, %Y')
          YEAR=$(date +%Y)

          # count how many "plyr.fm update - {date}" tracks exist for today
          # grep -c returns exit code 1 on no match, so default to 0
          TODAY_COUNT=$(echo "$EXISTING" | grep -c "plyr.fm update - $TODAY" || true)
          TODAY_COUNT=${TODAY_COUNT:-0}

          if [ "$TODAY_COUNT" -gt 0 ]; then
            # already have one today, add episode number
            EPISODE=$((TODAY_COUNT + 1))
            TITLE="plyr.fm update - $TODAY (#$EPISODE)"
          else
            TITLE="plyr.fm update - $TODAY"
          fi

          # attach the podcast transcript as the track description, if present
          DESCRIPTION_ARGS=()
          if [ -f podcast_script.txt ]; then
            DESCRIPTION_ARGS=(--description "$(cat podcast_script.txt)")
          fi

          echo "Uploading as: $TITLE"
          uv run --with "plyrfm>=0.0.1a21" -- plyrfm tracks upload \
            update.wav "$TITLE" --album "$YEAR" -t "ai" "${DESCRIPTION_ARGS[@]}"
        env:
          PLYR_TOKEN: ${{ secrets.PLYR_BOT_TOKEN }}
