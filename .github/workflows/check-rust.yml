name: check rust services

on:
  pull_request:
    paths:
      - "services/moderation/**"
      - "services/transcoder/**"
      - "backend/src/backend/upload_contract.json"
      - ".github/workflows/check-rust.yml"

permissions:
  contents: read

jobs:
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    outputs:
      moderation: ${{ steps.filter.outputs.moderation }}
      transcoder: ${{ steps.filter.outputs.transcoder }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            moderation:
              - 'services/moderation/**'
              - '.github/workflows/check-rust.yml'
            transcoder:
              - 'services/transcoder/**'
              - 'backend/src/backend/upload_contract.json'
              - '.github/workflows/check-rust.yml'

  check:
    name: cargo check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/moderation
            changed: ${{ needs.changes.outputs.moderation }}
          - service: services/transcoder
            changed: ${{ needs.changes.outputs.transcoder }}

    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: install rust toolchain
        if: matrix.changed == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        if: matrix.changed == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ${{ matrix.service }}

      - name: cargo check
        if: matrix.changed == 'true'
        working-directory: ${{ matrix.service }}
        run: cargo check --release

      - name: skip (no changes)
        if: matrix.changed != 'true'
        run: echo "skipping ${{ matrix.service }} - no changes"

  moderation-tests:
    name: moderation tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: changes
    if: needs.changes.outputs.moderation == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relay_test
          POSTGRES_PASSWORD: relay_test
          POSTGRES_DB: relay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 1s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/moderation
      - name: test against Postgres
        working-directory: services/moderation
        run: cargo test
        env:
          DATABASE_URL: postgresql://relay_test:relay_test@localhost:5432/relay_test

  docker-build:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [changes, check]

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: services/moderation
            context: services/moderation
            changed: ${{ needs.changes.outputs.moderation }}
          - service: services/transcoder
            context: .
            changed: ${{ needs.changes.outputs.transcoder }}

    steps:
      - uses: actions/checkout@v4
        if: matrix.changed == 'true'

      - name: build docker image
        if: matrix.changed == 'true'
        run: docker build -f ${{ matrix.service }}/Dockerfile -t ${{ matrix.service }}:ci-test ${{ matrix.context }}

      - name: skip (no changes)
        if: matrix.changed != 'true'
        run: echo "skipping ${{ matrix.service }} - no changes"
