name: deploy transcoder

on:
  workflow_call:
    inputs:
      target:
        type: string
        required: true
    secrets:
      deploy_token:
        required: true
      processing_token:
        required: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    concurrency: deploy-transcoder-${{ inputs.target }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy transcoder
        env:
          TARGET: ${{ inputs.target }}
          FLY_API_TOKEN: ${{ secrets.deploy_token }}
          PROCESSING_TOKEN: ${{ secrets.processing_token }}
        run: |
          case "$TARGET" in
            staging)
              test -n "$PROCESSING_TOKEN"
              printf 'NEXT_PROCESSING_AUTH_TOKEN=%s\n' "$PROCESSING_TOKEN" | flyctl secrets import --stage --app plyr-transcoder-staging
              flyctl deploy --config services/transcoder/fly.staging.toml --remote-only --ha=false .
              flyctl scale count 1 --app plyr-transcoder-staging --region iad --yes
              exit 0
              ;;
            production) config=services/transcoder/fly.toml ;;
            *) exit 1 ;;
          esac
          flyctl deploy --config "$config" --remote-only .
