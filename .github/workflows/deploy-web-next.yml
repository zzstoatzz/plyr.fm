name: deploy next web

# Builds next/web/ (the read-only-appview frontend) and deploys it to the
# production branch of the direct-upload pages project plyr-fm-next, which
# next.plyr.fm already CNAMEs to. Never touches production-fe or the plyr-fm
# pages project.
on:
  push:
    branches:
      - main
    paths:
      - "next/web/**"
      - ".github/workflows/deploy-web-next.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: deploy next web
    runs-on: ubuntu-latest
    concurrency: deploy-web-next
    permissions:
      contents: read
      deployments: write
    env:
      PUBLIC_API_URL: https://api.next.plyr.fm
      PUBLIC_SITE_URL: https://next.plyr.fm
      PUBLIC_NSID_PREFIX: fm.plyr.stg
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/web/package-lock.json

      - name: check and build
        working-directory: next/web
        run: |
          npm ci
          npm run check
          npm run build

      # the project predates this workflow, so deploy to whatever branch it
      # serves as production rather than guessing (a non-production branch
      # only lands on a <branch>.plyr-fm-next.pages.dev preview).
      - name: resolve production branch
        id: project
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/plyr-fm-next" \
            | jq -er '.result.production_branch')
          echo "production branch: $branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: deploy to cloudflare pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy next/web/build --project-name plyr-fm-next --branch ${{ steps.project.outputs.branch }}
