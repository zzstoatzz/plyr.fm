name: check next native

# Keep this filename registered for manual Expo hotfix dispatches on next-expo.
on:
  pull_request:
    paths:
      - "next/app/**"
      - "next/core/**"
      - "next/scripts/check-boundaries.mjs"
      - "next/package.json"
      - "next/bun.lock"
      - "next/vendor/**"
      - "next/patches/**"
      - ".github/workflows/deploy-web-next.yml"

permissions:
  contents: read

jobs:
  check:
    name: check next native
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: next
      - run: bun run check:boundaries
        working-directory: next
      - name: check native app
        working-directory: next/app
        run: |
          bun run lint
          bun run check
          bun run test
      - name: bundle iOS and Android
        working-directory: next/app
        run: bun run expo export --platform ios --platform android --output-dir "$RUNNER_TEMP/next-native"
