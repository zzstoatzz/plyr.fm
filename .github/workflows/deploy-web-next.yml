name: deploy frozen Expo to Next

on:
  workflow_dispatch:
    inputs:
      target:
        description: Next deployment target
        required: true
        type: choice
        options:
          - preview
          - live
        default: preview

jobs:
  deploy:
    if: github.ref == 'refs/heads/next-expo'
    name: deploy frozen Expo to Next
    runs-on: ubuntu-latest
    concurrency: next-expo-pages
    permissions:
      contents: read
      deployments: write
    env:
      EXPO_PUBLIC_API_URL: https://api.next.plyr.fm
      EXPO_PUBLIC_SITE_URL: https://next.plyr.fm
      EXPO_PUBLIC_NSID_PREFIX: fm.plyr
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/app/package-lock.json

      - name: check and build
        working-directory: next/app
        run: |
          npm ci
          npm run lint
          npm run check
          npm test
          npm run build:web
          test -s dist/index.html
          test -s dist/oauth-client-metadata.json
          test -s dist/oauth-native-client-metadata.json
          test ! -e dist/404.html

      # home, a track, now playing and the queue at phone and desktop widths, light and dark, against fixtures.
      # a layout regression here stops the deploy.
      - name: check key screens
        working-directory: next/app
        run: |
          npm install --no-save --no-package-lock playwright@1.61.1
          npx --no-install playwright install --with-deps chromium
          PLAYWRIGHT_MODULE="$PWD/node_modules/playwright" SCREENS_OUTPUT="$RUNNER_TEMP/screens" node scripts/check-key-screens.cjs

      - name: upload key screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-key-screens
          path: ${{ runner.temp }}/screens
          if-no-files-found: ignore

      - name: select Pages branch
        id: pages
        env:
          RELEASE_TARGET: ${{ inputs.target }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          live_branch=$(curl -fsS \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/plyr-fm-next" \
            | jq -er '.result.production_branch | select(type == "string" and length > 0)')
          case "$RELEASE_TARGET" in
            preview)
              branch=next-expo-preview
              if [ "$branch" = "$live_branch" ]; then
                echo "::error::The preview branch is configured as the live branch in Cloudflare."
                exit 1
              fi
              ;;
            live) branch="$live_branch" ;;
            *) exit 1 ;;
          esac
          printf 'branch=%s\n' "$branch" >> "$GITHUB_OUTPUT"

      - name: deploy to cloudflare pages
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy next/app/dist --project-name plyr-fm-next --branch ${{ steps.pages.outputs.branch }}
