# copy legacy production play totals into next's track_metrics
# (next/backend/scripts/import_legacy_plays). safe to re-run: each run adds
# only the plays legacy counted since the last import, and keeps plays next
# counted itself. run it again as the final step of the cutover export.
#
# also runs (for real) when this workflow or the script changes on main, so
# a fix lands without anyone dispatching it.
#
# reads prod read-only; writes only the database marked 'plyr-zig-next'.
# logs print counts only.
#
# required secrets:
#   NEON_DATABASE_URL_PRD - legacy production database
#   ZIG_NEXT_MIGRATOR_DATABASE_URL - next database

name: next import legacy plays

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/next-import-legacy-plays.yml
      - next/backend/scripts/import_legacy_plays
  workflow_dispatch:
    inputs:
      dry_run:
        description: "dry run (report counts, write nothing)"
        type: boolean
        default: true

jobs:
  run:
    runs-on: ubuntu-latest
    concurrency: next-import-legacy-plays
    steps:
      - uses: actions/checkout@v4
      - name: import play totals
        working-directory: next/backend
        env:
          LEGACY_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_PRD }}
          DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
        run: |
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          scripts/import_legacy_plays
