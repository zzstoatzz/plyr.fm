name: deploy Zig canary

on:
  workflow_dispatch:

jobs:
  deploy:
    name: deploy Zig canary
    runs-on: ubuntu-latest
    concurrency: deploy-zig-canary
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: deploy to Fly.io
        working-directory: backend-zig
        run: flyctl deploy --config fly.canary.toml --remote-only --app plyr-api-zig-canary
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_STAGING }}
