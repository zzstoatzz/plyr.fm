name: next audio service

on:
  pull_request:
    paths:
      - "next/services/audio/**"
      - ".github/workflows/deploy-next-audio.yml"
  push:
    branches: [main]
    paths:
      - "next/services/audio/**"
      - ".github/workflows/deploy-next-audio.yml"
  workflow_dispatch:
    inputs:
      verify_upload:
        description: Verify deployed multipart activation with the disposable integration account
        type: boolean
        default: false
      diagnose_upload:
        description: Capture one existing public record proof without creating a fixture
        type: boolean
        default: false
      full_size:
        description: Verify 1.5 GiB through real R2 with the disposable integration account
        type: boolean
        default: false
      resume_upload_id:
        description: Existing failed fixture UUID from its reservation artifact
        type: string
        default: ""
      resume_record_rkey:
        description: Matching record key from that same fixture artifact
        type: string
        default: ""

permissions:
  contents: read

concurrency: next-audio-${{ github.event_name == 'pull_request' && github.ref || 'main' }}

jobs:
  audio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: next/services/audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/services/audio/package-lock.json
      - run: npm ci
      - run: npm run check && npm test
      - name: install fixture SDK
        run: npm ci --prefix ../../app
      - name: check fixture cleanup
        run: node --experimental-strip-types --test scripts/*node-check.mjs
      - name: validate worker bundle
        run: npx --no-install wrangler deploy --dry-run
      - name: deploy existing next audio service
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && !inputs.diagnose_upload
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          UPLOAD_CAPABILITY_SECRET: ${{ secrets.PLYR_NEXT_UPLOAD_CAPABILITY_SECRET }}
        run: |
          set -euo pipefail
          test -n "$UPLOAD_CAPABILITY_SECRET"
          export UPLOAD_SECRETS_FILE="$(mktemp --suffix=.json)"
          trap 'rm -f "$UPLOAD_SECRETS_FILE"' EXIT
          node --input-type=module -e 'import { writeFileSync } from "node:fs"; writeFileSync(process.env.UPLOAD_SECRETS_FILE, JSON.stringify({ UPLOAD_CAPABILITY_SECRET: process.env.UPLOAD_CAPABILITY_SECRET }), { mode: 0o600 });'
          npm run deploy -- --secrets-file "$UPLOAD_SECRETS_FILE"
      - name: verify deployed upload activation
        if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && (inputs.verify_upload || inputs.diagnose_upload || inputs.full_size)
        env:
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DIAGNOSE_UPLOAD: ${{ inputs.diagnose_upload }}
          VERIFY_UPLOAD_FULLSIZE: ${{ inputs.full_size }}
          RESUME_UPLOAD_ID: ${{ inputs.resume_upload_id }}
          RESUME_RECORD_RKEY: ${{ inputs.resume_record_rkey }}
        run: node --experimental-strip-types scripts/verify-upload.mjs
      - name: retain full-size acceptance and exact cleanup receipt
        if: always() && github.event_name == 'workflow_dispatch' && inputs.full_size && !inputs.diagnose_upload
        uses: actions/upload-artifact@v4
        with:
          name: full-size-upload-acceptance
          path: next/services/audio/upload-acceptance
          retention-days: 3
          if-no-files-found: error
      - name: retain bounded public proof
        if: always() && github.event_name == 'workflow_dispatch' && inputs.diagnose_upload
        uses: actions/upload-artifact@v4
        with:
          name: upload-public-proof
          path: next/services/audio/upload-diagnostic
          retention-days: 3
          if-no-files-found: error
