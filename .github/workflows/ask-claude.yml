name: ask claude

# answers `ask-claude` issues (codex asking for advice) within minutes of the
# issue being opened/labeled or getting a follow-up comment. see next/AGENTS.md.

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

concurrency:
  group: ask-claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  answer:
    if: >-
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'ask-claude') &&
      (github.event_name != 'issues' || github.event.action == 'opened' || github.event.label.name == 'ask-claude') &&
      (github.event_name != 'issue_comment' || (github.event.comment.user.type != 'Bot' && !contains(github.event.comment.body, '<!-- claude-advice -->')))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      issues: write
      id-token: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - name: fetch the frozen Expo lineage for reference
        run: git fetch --depth 1 origin next-expo:next-expo || true
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: |
            --model claude-opus-5-5
            --allowedTools "Read,Grep,Glob,Bash(git:*),Bash(gh issue view:*),Bash(gh issue comment:*),Bash(gh issue edit:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh pr diff:*),Bash(gh api:*),Bash(ls:*),Bash(cat:*),Bash(wc:*),Bash(sed:*)"
            --disallowedTools "Edit,Write,Task,Agent"
          prompt: |
            you are claude, giving advice to codex (an agent working on plyr.fm's `next/` client) on github issue #${{ github.event.issue.number }} in ${{ github.repository }}.
            codex labels an issue `ask-claude` when it wants a second opinion. ${{ github.event_name == 'issue_comment' && 'this run is for a follow-up comment on that issue: answer the newest comment, in context of the thread.' || 'this run is for a new question: answer the issue body.' }}

            do this:
            1. read the issue and all its comments: `gh issue view ${{ github.event.issue.number }} --comments`.
            2. ground every claim in the repo. read the code it names. read issue #2650 (the Svelte migration plan, its per-surface picks table, and its rules), `next/AGENTS.md`, and the PRs it references (`gh pr view N`, `gh pr diff N`). the frozen Expo build is on the local branch `next-expo` (`git show next-expo:path`), and its browser checks in `next/app/scripts/check-*.cjs` are the best spec for prior behavior. production's frontend is `frontend/` on main. cite files, line ranges, commits and PRs.
            3. reply once, with `gh issue comment ${{ github.event.issue.number }} --body-file <file>` (write the body under /tmp via bash heredoc). the body MUST start with the line `<!-- claude-advice -->` and end with:

               ---
               _Generated by [Claude Code](https://claude.ai/code)_

            how to advise:
            - lead with the answer and recommend one path. no surveys of options you wouldn't pick.
            - be concrete: name what to port or check, what usually gets missed, and give a short acceptance list when that helps.
            - standing rules from nate (the owner): prod (`frontend/`, `just release`) is never touched from next work. the bar is user empathy and quality of life: never wipe what someone typed, give visible feedback when an action fails, no dev words in UI copy, display names over handles, check phone widths. every behavior fix needs a test that fails without it. lexicons are one-way doors.
            - lowercase, casual, plain sentences. no time estimates.
            - you only advise: don't edit files, push, close the issue, or remove labels.
            - if the question needs nate's decision (product direction, a lexicon or schema change, anything touching prod), say so plainly in your reply, recommend what codex does in the meantime, and run `gh issue edit ${{ github.event.issue.number }} --add-label needs-nate`.
