name: deploy next (zig)

# Deploys next/backend to the isolated next environment only:
#   fly app  plyr-api-zig-canary  (api.next.plyr.fm)
#            (process groups: app = api, ingester = jetstream -> plyr_index)
#   database the Neon branch of staging marked 'plyr-zig-next'
# It never touches relay-api, relay-api-staging, their databases, or
# production-fe. Deploys on every push to main that touches next/backend
# (PRs already ran the zig tests), and by manual dispatch.
on:
  push:
    branches:
      - main
    paths:
      - "next/backend/**"
      - "!next/backend/docs/**"
      - "!next/backend/**/*.md"
      - ".github/workflows/deploy-next.yml"
  workflow_dispatch:
    inputs:
      reconcile_catalog:
        description: re-index staging-namespace repositories into next before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency: deploy-next

env:
  FLY_APP: plyr-api-zig-canary

jobs:
  # migrations and the image build are independent, so they run side by side;
  # the deploy waits for both.
  migrate:
    name: migrate next db
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: preflight next-only credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
          ZIG_NEXT_WRITER_DATABASE_URL: ${{ secrets.ZIG_NEXT_WRITER_DATABASE_URL }}
          ZIG_NEXT_MIGRATOR_DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
        run: |
          test -n "$FLY_API_TOKEN"
          test -n "$ZIG_NEXT_WRITER_DATABASE_URL"
          test -n "$ZIG_NEXT_MIGRATOR_DATABASE_URL"
          flyctl secrets list --app "$FLY_APP" --json > "$RUNNER_TEMP/next-secrets.json"
          uv run --no-project python - "$RUNNER_TEMP/next-secrets.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              configured = {item.get("Name") or item.get("name") for item in json.load(source)}
          required = {
              "DATABASE_URL",
              "DOCKET_URL",
          }
          missing = sorted(required - configured)
          if missing:
              raise SystemExit(f"missing next secrets: {', '.join(missing)}")
          PY

      # scripts/migrate refuses any database without the 'plyr-zig-next'
      # marker, so a mis-set secret cannot reach staging or prod.
      - name: apply next/backend migrations to the next branch
        working-directory: next/backend
        env:
          DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
        run: |
          # ubuntu runners ship psql; only install it if an image ever drops it
          command -v psql > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client; }
          scripts/migrate

  build:
    name: build next image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: build and publish image
        working-directory: next/backend
        run: >-
          flyctl deploy
          --config fly.canary.toml
          --remote-only
          --app "$FLY_APP"
          --build-only
          --push
          --image-label "$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}

  deploy:
    name: deploy next api
    needs: [migrate, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The ingester process group writes plyr_index as the branch owner. Its
      # credential is staged as WORKER_DATABASE_URL, which only non-api roles
      # read; the api keeps DATABASE_URL (read-only) and its DATABASE_ROLE pin.
      - name: stage ingester credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
          WORKER_DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
        run: flyctl secrets set --stage --app "$FLY_APP" WORKER_DATABASE_URL="$WORKER_DATABASE_URL" > /dev/null

      - name: deploy image
        working-directory: next/backend
        run: >-
          flyctl deploy
          --config fly.canary.toml
          --app "$FLY_APP"
          --ha=false
          --image "registry.fly.io/${FLY_APP}:${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}

      - name: smoke the deployed api
        working-directory: next/backend
        run: uv run --no-project python scripts/canary_smoke.py "https://${FLY_APP}.fly.dev"

      - name: colocate the stateless API with its database
        timeout-minutes: 8
        working-directory: next/backend
        run: uv run --no-project python scripts/canary_placement.py
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}

      - name: smoke after API placement
        working-directory: next/backend
        run: uv run --no-project python scripts/canary_smoke.py "https://${FLY_APP}.fly.dev"

      - name: ingester status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
        run: |
          flyctl status --app "$FLY_APP"
          flyctl logs --app "$FLY_APP" --no-tail | grep -i ingest | tail -30 || true

      - name: reconcile the fm.plyr catalog into next
        if: inputs.reconcile_catalog
        timeout-minutes: 70
        run: next/backend/scripts/canary_reconcile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
          WORKER_DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}

      - name: clean up the reconciliation machine
        timeout-minutes: 5
        if: always() && inputs.reconcile_catalog
        run: next/backend/scripts/canary_reconcile --cleanup-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
