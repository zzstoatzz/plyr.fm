name: deploy next (zig)

# Deploys next/backend to the isolated next environment only:
#   fly app  plyr-api-zig-canary  (api.next.plyr.fm)
#            (process groups: app = api, ingester = jetstream -> plyr_index)
#   database the Neon branch of staging marked 'plyr-zig-next'
# It never touches relay-api, relay-api-staging, their databases, or
# production-fe. Manual dispatch only.
on:
  workflow_dispatch:
    inputs:
      reconcile_catalog:
        description: re-index staging-namespace repositories into next before deploying
        type: boolean
        default: false

permissions:
  contents: read

concurrency: deploy-next

env:
  FLY_APP: plyr-api-zig-canary

jobs:
  deploy:
    name: deploy next api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: preflight next-only credentials
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
          ZIG_NEXT_WRITER_DATABASE_URL: ${{ secrets.ZIG_NEXT_WRITER_DATABASE_URL }}
          ZIG_NEXT_MIGRATOR_DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
        run: |
          test -n "$FLY_API_TOKEN"
          test -n "$ZIG_NEXT_WRITER_DATABASE_URL"
          test -n "$ZIG_NEXT_MIGRATOR_DATABASE_URL"
          flyctl secrets list --app "$FLY_APP" --json > "$RUNNER_TEMP/next-secrets.json"
          python3 - "$RUNNER_TEMP/next-secrets.json" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              configured = {item.get("Name") or item.get("name") for item in json.load(source)}
          required = {
              "DATABASE_URL",
              "DOCKET_URL",
          }
          missing = sorted(required - configured)
          if missing:
              raise SystemExit(f"missing next secrets: {', '.join(missing)}")
          PY

      # scripts/migrate refuses any database without the 'plyr-zig-next'
      # marker, so a mis-set secret cannot reach staging or prod.
      - name: apply next/backend migrations to the next branch
        working-directory: next/backend
        env:
          DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client
          scripts/migrate

      - name: build and publish image
        working-directory: next/backend
        run: >-
          flyctl deploy
          --config fly.canary.toml
          --remote-only
          --app "$FLY_APP"
          --build-only
          --push
          --image-label "$GITHUB_SHA"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}

      # The reconciler reads the python tables and writes plyr_index, so it
      # runs as the migrator (the branch owner). It is passed as
      # WORKER_DATABASE_URL because the app's DATABASE_URL secret (the api's
      # read-only role) is injected into every machine and wins over --env.
      # `machine run` returns once the machine starts, so wait for it to exit
      # and fail the job on a nonzero exit code instead of passing silently.
      - name: reconcile staging-namespace catalog into next
        if: inputs.reconcile_catalog
        run: |
          set -euo pipefail
          flyctl machine run "registry.fly.io/${FLY_APP}:${GITHUB_SHA}" \
            --app "$FLY_APP" \
            --region sjc \
            --restart no \
            --skip-dns-registration \
            --vm-cpu-kind shared \
            --vm-cpus 1 \
            --vm-memory 256 \
            --metadata purpose=zig-catalog-reconciliation \
            --env "WORKER_DATABASE_URL=${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}" \
            --env MODE=catalog_reconciler \
            --env INDEX_MODE=required \
            --env TRACK_COLLECTION_NSID=fm.plyr.track \
            --env LIST_COLLECTION_NSID=fm.plyr.list \
            --env LIKE_COLLECTION_NSID=fm.plyr.like \
            --env PROFILE_COLLECTION_NSID=fm.plyr.actor.profile \
            --env CATALOG_DISCOVERY_RELAY=https://relay1.us-east.bsky.network \
            | tee "$RUNNER_TEMP/reconcile.out"
          machine_id="$(grep -oE 'Machine ID: [0-9a-f]+' "$RUNNER_TEMP/reconcile.out" | awk '{print $3}' | head -1)"
          test -n "$machine_id"
          echo "reconciler machine $machine_id"
          deadline=$((SECONDS + 1800))
          while :; do
            state="$(flyctl machines list --app "$FLY_APP" --json | jq -r --arg id "$machine_id" '.[] | select(.id == $id) | .state')"
            case "$state" in stopped | destroyed | failed) break ;; esac
            if (( SECONDS > deadline )); then echo "reconciler still $state after 30m" >&2; exit 1; fi
            sleep 10
          done
          # `machines list --json` omits events, so read the exit event from
          # the Machines API (machine is still around; destroyed below).
          case "$FLY_API_TOKEN" in FlyV1\ *) auth="$FLY_API_TOKEN" ;; *) auth="Bearer $FLY_API_TOKEN" ;; esac
          exit_code="$(curl -fsS -H "Authorization: $auth" \
            "https://api.machines.dev/v1/apps/${FLY_APP}/machines/${machine_id}" \
            | jq -r '[.events[]? | select(.type == "exit") | .request.exit_event.exit_code][0] // "unknown"')" || exit_code=unknown
          flyctl logs --app "$FLY_APP" --machine "$machine_id" --no-tail | tail -50 || true
          flyctl machine destroy "$machine_id" --app "$FLY_APP" --force || true
          echo "reconciler exited with $exit_code"
          test "$exit_code" = "0"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}

      # The ingester process group writes plyr_index as the branch owner. Its
      # credential is staged as WORKER_DATABASE_URL, which only non-api roles
      # read; the api keeps DATABASE_URL (read-only) and its DATABASE_ROLE pin.
      - name: stage ingester credential
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
          WORKER_DATABASE_URL: ${{ secrets.ZIG_NEXT_MIGRATOR_DATABASE_URL }}
        run: flyctl secrets set --stage --app "$FLY_APP" WORKER_DATABASE_URL="$WORKER_DATABASE_URL" > /dev/null

      - name: deploy image
        working-directory: next/backend
        run: >-
          flyctl deploy
          --config fly.canary.toml
          --app "$FLY_APP"
          --ha=false
          --image "registry.fly.io/${FLY_APP}:${GITHUB_SHA}"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}

      - name: smoke the deployed api
        working-directory: next/backend
        run: python3 scripts/canary_smoke.py "https://${FLY_APP}.fly.dev"

      - name: ingester status
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_ZIG_NEXT }}
        run: |
          flyctl status --app "$FLY_APP"
          sleep 45
          flyctl logs --app "$FLY_APP" --no-tail | grep -i ingest | tail -30 || true
