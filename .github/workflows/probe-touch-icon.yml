name: probe touch icon
on:
  push:
    branches: [probe-touch-icon]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1"
          for i in $(seq 1 60); do
            if curl -s -A "$UA" "https://plyr.fm/?cb=$RANDOM" | grep -q 'apple-touch-icon.png?v=2'; then echo "link live after $i tries"; break; fi
            sleep 10
          done
          curl -s -A "$UA" "https://plyr.fm/" | grep -oiE '<link[^>]*apple-touch-icon[^>]*>'
          curl -s -o /dev/null -A "$UA" -w "%{http_code} %{content_type} %{size_download}\n" "https://plyr.fm/apple-touch-icon.png?v=2"
