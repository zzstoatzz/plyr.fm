name: probe touch icon
on:
  push:
    branches: [probe-touch-icon]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set +e
          UA="Mozilla/5.0 (iPhone; CPU iPhone OS 18_5 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/18.5 Mobile/15E148 Safari/604.1"
          for h in plyr.fm next.plyr.fm; do
            echo "=== $h HTML headers"; curl -s -o /tmp/p.html -A "$UA" "https://$h/"
            grep -oiE '<meta[^>]*(http-equiv|csp)[^>]*>' /tmp/p.html
            echo "=== $h manifest"; curl -s -A "$UA" "https://$h/manifest.webmanifest"
            for p in /apple-touch-icon.png /apple-touch-icon.png?v=2 /icons/icon-192.png /icons/icon-512.png; do
              curl -s -o /tmp/i -A "$UA" -H "Accept: image/png,image/*;q=0.8" -H "Sec-Fetch-Dest: image" -H "Sec-Fetch-Mode: no-cors" -H "Sec-Fetch-Site: same-origin" -w "%{http_code} %{content_type} %{size_download} $h$p\n" "https://$h$p"; file /tmp/i
            done
          done
