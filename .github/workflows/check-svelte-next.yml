name: check next svelte web

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deploy Next web or verify the live browser
        type: choice
        options:
          [
            preview,
            live,
            verify-live-upload-consent,
            verify-live-jam,
            verify-live-like,
            verify-live-publish,
            verify-live-not-found,
          ]
        default: preview
  pull_request:
    paths:
      - "next/web/**"
      - "next/core/**"
      - "next/package.json"
      - "next/bun.lock"
      - "next/vendor/**"
      - "next/scripts/check-boundaries.mjs"
      - "next/scripts/check-type-scale.mjs"
      - "next/scripts/check-play-controls.mjs"
      - "next/scripts/check-pagination.mjs"
      - ".github/workflows/check-svelte-next.yml"
      - ".github/actions/next-web-source-key/**"
  # a merge to main ships next web live, like the next api; next has no users to protect
  push:
    branches: [main]
    paths:
      - "next/web/**"
      - "next/core/**"
      - "next/package.json"
      - "next/bun.lock"
      - "next/vendor/**"
      - "next/scripts/check-boundaries.mjs"
      - "next/scripts/check-type-scale.mjs"
      - "next/scripts/check-play-controls.mjs"
      - "next/scripts/check-pagination.mjs"
      - ".github/workflows/check-svelte-next.yml"
      - ".github/actions/next-web-source-key/**"

permissions:
  contents: read

# A newer push to a PR replaces the run for the older one.
concurrency:
  group: next-svelte-web-${{ github.event_name == 'workflow_dispatch' && inputs.target || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A merge whose next web source already passed every check on its PR skips
  # straight to the deploy (nate's call, 2026-11-23). The PR proves it with an
  # artifact named after a hash of everything this workflow watches, this file
  # included, so a PR that edits the checks can't vouch for the ones main runs.
  # Any lookup failure means "run the checks".
  gate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      verified: ${{ steps.lookup.outputs.verified }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        uses: ./.github/actions/next-web-source-key
      - id: lookup
        env:
          GH_TOKEN: ${{ github.token }}
          KEY: ${{ steps.source.outputs.key }}
        run: |
          found="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=next-web-verified-$KEY&per_page=20" \
            --jq '[.artifacts[] | select(.expired | not)] | length' 2> /dev/null || echo 0)"
          if [ "${found:-0}" -gt 0 ]; then
            echo "verified=true" >> "$GITHUB_OUTPUT"
            echo "next web source $KEY already passed check + browser on its PR; deploying without re-running them" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "verified=false" >> "$GITHUB_OUTPUT"
          fi

  # The gate: types, boundaries, unit tests and the build. Fast, so a PR knows within about 30s.
  check:
    needs: gate
    if: >-
      !cancelled() && needs.gate.outputs.verified != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'preview' || inputs.target == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: next/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: next
      - run: bun run check:boundaries && bun run check:type-scale && bun run check:play-controls && bun run check:like-state && bun run check:pagination
        working-directory: next
      - run: bun run check && bun run test
        working-directory: next/core
      - run: bun run check
      - run: bun run build
      - run: bun run test

  # The browser checks, side by side instead of one after another.
  browser:
    needs: gate
    if: >-
      !cancelled() && needs.gate.outputs.verified != 'true' &&
      (github.event_name != 'workflow_dispatch' || inputs.target == 'preview' || inputs.target == 'live')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shell
            run: node scripts/check-shell.cjs
          - name: queue
            run: node scripts/check-queue-gestures.cjs && node scripts/check-queue-suggestions.cjs
          - name: restoration
            run: node scripts/check-desktop-restoration.cjs && node scripts/check-restored-listening.cjs
          - name: embed
            run: bun run check:embed-live && bun run check:embed
          - name: radio
            run: bun run check:radio
          - name: player-transition
            run: bun run check:player-transition
          - name: player-presentation
            run: bun run check:player-presentation && bun run check:likers
          # the slowest checks, one job each so none of them sets the pace for the rest
          - name: artist-catalog
            run: bun run check:artist-catalog
          - name: atlas
            run: bun run check:atlas
          - name: paged-lists
            run: bun run check:paged-lists
          # holds the wheel down on home through several pages of latest and records the rail every frame
          # (with video): the live site as it is, then this build on the live catalog, which must not move
          - name: home-rail-scroll
            run: RAIL_SITE=live node scripts/probe-home-rail-scroll.mjs; RAIL_STRICT=1 node scripts/probe-home-rail-scroll.mjs
    defaults:
      run:
        working-directory: next/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: next
      - id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: bun run playwright install --with-deps --only-shell chromium
        if: steps.browsers.outputs.cache-hit != 'true'
      - run: bun run build
      - run: ${{ matrix.run }}
        env:
          SCREENS_OUTPUT: ${{ runner.temp }}/next-svelte-screens/${{ matrix.name }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: next-svelte-screens-${{ matrix.name }}
          path: ${{ runner.temp }}/next-svelte-screens/${{ matrix.name }}
          if-no-files-found: ignore

  # a PR that passed everything vouches for its exact source (see gate)
  mark-verified:
    if: github.event_name == 'pull_request'
    needs: [check, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - id: source
        uses: ./.github/actions/next-web-source-key
      - env:
          PR: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p "$RUNNER_TEMP/verified"
          printf 'pr=%s\nsha=%s\nrun=%s\n' "$PR" "$GITHUB_SHA" "$GITHUB_RUN_ID" > "$RUNNER_TEMP/verified/source.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: next-web-verified-${{ steps.source.outputs.key }}
          path: ${{ runner.temp }}/verified
          retention-days: 14

  deploy:
    needs: [gate, check, browser]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || inputs.target == 'preview' || inputs.target == 'live') &&
      (needs.gate.outputs.verified == 'true' || (needs.check.result == 'success' && needs.browser.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency: next-svelte-web-pages-${{ inputs.target || 'live' }}
    env:
      PUBLIC_SITE_URL: ${{ inputs.target == 'preview' && 'https://plyr-fm-next-svelte.pages.dev' || 'https://next.plyr.fm' }}
    defaults:
      run:
        working-directory: next/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: next
      - run: bun run build
      - name: check browser access to Next
        run: |
          check_origin() {
            curl -fsS -D - -o /dev/null -H "Origin: $PUBLIC_SITE_URL" "$@" |
              tr -d '\r' | grep -ix "access-control-allow-origin: $PUBLIC_SITE_URL"
          }
          check_origin https://api.next.plyr.fm/health
          check_origin -X OPTIONS -H 'Access-Control-Request-Method: POST' https://jams.next.plyr.fm/v1/playback/join
          check_origin -X OPTIONS -H 'Access-Control-Request-Method: POST' https://plyr-next-audio.n8-3e9.workers.dev/v1/genres
      - name: select Next Pages deployment
        id: pages
        env:
          TARGET: ${{ inputs.target || 'live' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ "$TARGET" = preview ]; then
            printf 'project=plyr-fm-next-svelte\nbranch=main\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test "$TARGET" = live
          curl -fsS https://plyr.fm/ -o /dev/null
          curl -fsS https://api.plyr.fm/health | jq -e '.status == "ok"'
          project=plyr-fm-next
          details=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$project")
          branch=$(jq -er '.result
            | select(.name == "plyr-fm-next" and (.domains | index("next.plyr.fm")))
            | select(.domains | all(. != "plyr.fm" and . != "www.plyr.fm" and . != "api.plyr.fm"))
            | .production_branch | select(test("^[A-Za-z0-9._/-]+$"))' <<< "$details")
          rollback=$(jq -er '.result.canonical_deployment | select(.environment == "production") | .id | select(length > 0)' <<< "$details")
          printf 'project=%s\nbranch=%s\n' "$project" "$branch" >> "$GITHUB_OUTPUT"
          printf 'Previous Next Pages deployment: `%s`\n' "$rollback" >> "$GITHUB_STEP_SUMMARY"
      - name: deploy Svelte to Next Pages
        uses: cloudflare/wrangler-action@v3
        with:
          wranglerVersion: "4.158.0"
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy next/web/build --project-name ${{ steps.pages.outputs.project }} --branch ${{ steps.pages.outputs.branch }} --commit-hash ${{ github.sha }}
      - name: verify deployed clients and callback
        run: |
          for attempt in {1..12}; do
            if curl -fsS "$PUBLIC_SITE_URL/oauth/callback?commit=$GITHUB_SHA" -o "$RUNNER_TEMP/next-callback.html" &&
              cmp -s build/index.html "$RUNNER_TEMP/next-callback.html"; then break; fi
            sleep 5
          done
          cmp build/index.html "$RUNNER_TEMP/next-callback.html"
          for client in oauth-client-metadata.json oauth-native-client-metadata.json; do
            curl -fsS "$PUBLIC_SITE_URL/$client?commit=$GITHUB_SHA" |
              jq -S . > "$RUNNER_TEMP/$client"
            jq -S . "build/$client" | diff - "$RUNNER_TEMP/$client"
          done
      - name: recheck production
        if: always() && (inputs.target || 'live') == 'live' && steps.pages.outcome == 'success'
        run: |
          curl -fsS https://plyr.fm/ -o /dev/null
          curl -fsS https://api.plyr.fm/health | jq -e '.status == "ok"'

  # dispatched targets run alone; every deploy from main also runs the signed-out not-found check
  verify-live-browser:
    needs: deploy
    if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'push' && needs.deploy.result == 'success') || (github.event_name == 'workflow_dispatch' && (inputs.target == 'verify-live-upload-consent' || inputs.target == 'verify-live-jam' || inputs.target == 'verify-live-like' || inputs.target == 'verify-live-publish' || inputs.target == 'verify-live-not-found')))
    runs-on: ubuntu-latest
    timeout-minutes: 8
    concurrency: next-live-browser
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: next
      - id: playwright
        working-directory: next/web
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-shell-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - run: bun run playwright install --with-deps --only-shell chromium
        if: steps.browsers.outputs.cache-hit != 'true'
        working-directory: next/web
      # the publish check plays AAC, which only branded Chrome decodes
      - run: bun run playwright install --with-deps chrome
        if: inputs.target == 'verify-live-publish'
        working-directory: next/web
      - name: verify live OAuth and upload admission in the browser
        if: inputs.target == 'verify-live-upload-consent'
        working-directory: next/web
        env:
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
        run: node scripts/check-live-upload-consent.mjs
      - name: verify live Jam host and signed-out guest
        if: inputs.target == 'verify-live-jam'
        working-directory: next/web
        env:
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
          ALPHA_TEST_HANDLE: ${{ secrets.ALPHA_TEST_HANDLE }}
          ALPHA_TEST_PASSWORD: ${{ secrets.ALPHA_TEST_PASSWORD }}
        run: node scripts/check-live-jam.mjs
      - name: verify live Like and Unlike
        if: inputs.target == 'verify-live-like'
        working-directory: next/web
        env:
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
        run: node scripts/check-live-like.mjs
      - name: verify a fresh public upload plays the moment it is published
        if: inputs.target == 'verify-live-publish'
        working-directory: next/web
        env:
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
          PLAYWRIGHT_CHANNEL: chrome
        run: node scripts/check-live-publish.mjs
      - name: verify missing pages show the not-found page
        if: github.event_name == 'push' || inputs.target == 'verify-live-not-found'
        working-directory: next/web
        run: node scripts/check-live-not-found.mjs
      - name: verify the home rail ends with radio and stays on screen
        if: github.event_name == 'push'
        working-directory: next/web
        run: node scripts/check-live-home-rail.mjs
      - name: verify artist pages carry links and background
        if: github.event_name == 'push'
        working-directory: next/web
        run: node scripts/check-live-artist-page.mjs
      - uses: actions/upload-artifact@v4
        if: always() && github.event_name == 'push'
        with:
          name: live-home-rail
          path: /tmp/plyr-live-home-rail
          if-no-files-found: ignore
