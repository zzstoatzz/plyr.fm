name: next osprey

# Next's moderation rules worker (next/services/osprey): ROOST's Osprey engine
# running plyr's SML rules over tracks the next appview indexes, writing review
# flags to next's moderation log. It runs on a schedule and stops once it has
# caught up; its cursor lives in next's database. Nothing here touches prod
# except asking prod's moderation service to fingerprint audio (/scan), which
# holds the AuDD key and writes nothing.

on:
  pull_request:
    paths:
      - "next/services/osprey/**"
      - "next/backend/migrations/0048_add_moderation_log.sql"
      - "next/backend/migrations/0050_add_moderation_rules_state.sql"
      - "next/backend/migrations/0056_add_image_scans.sql"
      - "next/backend/migrations/0058_backfill_cover_checks.sql"
      - ".github/workflows/next-osprey.yml"
  push:
    branches: [main]
    paths:
      - "next/services/osprey/**"
      - "next/backend/migrations/0058_backfill_cover_checks.sql"
      - ".github/workflows/next-osprey.yml"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      check_direct_pds:
        description: "write a blob-only track to the test account's PDS and check next scans it"
        type: boolean
        default: false

permissions:
  contents: read
  # a push waits for that commit's next deploy (migrations, grants) to land
  actions: read

jobs:
  test:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: osprey_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: next/services/osprey
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - run: uvx ruff check src tests && uvx ruff format --check src tests
      - run: scripts/test
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/osprey_test

  run:
    needs: test
    # a push runs it once the tests pass; the schedule and a manual run skip the tests
    if: always() && github.ref == 'refs/heads/main' && !inputs.check_direct_pds && (needs.test.result == 'success' || needs.test.result == 'skipped')
    runs-on: ubuntu-latest
    # a backfill can take more than one run; each record's result is kept as it goes
    timeout-minutes: 60
    concurrency:
      group: next-osprey-run
      cancel-in-progress: false
    defaults:
      run:
        working-directory: next/services/osprey
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: wait for this commit's next deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-next.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '.workflow_runs[0] | select(.) | .status + " " + (.conclusion // "")')"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "next deploy for $GITHUB_SHA: $state"; exit 1 ;;
              "") if [ "$i" -gt 6 ]; then echo "no next deploy for this commit"; exit 0; fi ;;
            esac
            sleep 20
          done
          echo "next deploy for $GITHUB_SHA didn't finish"; exit 1
      - name: run the rules until caught up
        env:
          DATABASE_URL: ${{ secrets.ZIG_NEXT_WRITER_DATABASE_URL }}
          MODERATION_SERVICE_URL: ${{ secrets.MODERATION_SERVICE_URL }}
          MODERATION_AUTH_TOKEN: ${{ secrets.MODERATION_AUTH_TOKEN }}
          OSPREY_DRAIN_ONCE: "true"
        run: scripts/run

  # a record written straight to a PDS, never through plyr's upload API, still
  # gets indexed, copied, fingerprinted and its cover checked
  # (scripts/check-direct-pds.py). runs after the rules worker changes on main,
  # or by hand.
  direct-pds:
    needs: run
    if: always() && github.ref == 'refs/heads/main' && ((github.event_name == 'workflow_dispatch' && inputs.check_direct_pds) || (github.event_name == 'push' && needs.run.result == 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: next-osprey-run
      cancel-in-progress: false
    defaults:
      run:
        working-directory: next/services/osprey
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: write, wait, scan, check
        env:
          TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          DATABASE_URL: ${{ secrets.ZIG_NEXT_WRITER_DATABASE_URL }}
          MODERATION_SERVICE_URL: ${{ secrets.MODERATION_SERVICE_URL }}
          MODERATION_AUTH_TOKEN: ${{ secrets.MODERATION_AUTH_TOKEN }}
        run: |
          osprey="$(scripts/setup)"
          "$osprey/.venv/bin/python" scripts/check-direct-pds.py
