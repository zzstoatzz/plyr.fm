name: pre-commit checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # to list a PR's changed files
  pull-requests: read

jobs:
  pre_commit:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: install just
        uses: extractions/setup-just@v3

      - name: detect changed paths
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            # code and config only: a change to app.html, static/ or docs needs no
            # svelte-check, eslint or vitest
            frontend:
              - 'frontend/**/*.{ts,js,mjs,cjs,svelte,json}'
              - 'frontend/bun.lock'
            rust:
              - 'services/moderation/**'
              - 'services/transcoder/**'

      - name: install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"

      - name: install bun
        if: steps.filter.outputs.frontend == 'true'
        uses: oven-sh/setup-bun@v2

      - name: cache frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: install backend dependencies
        if: steps.filter.outputs.backend == 'true'
        run: cd backend && uv sync --locked

      - name: install frontend dependencies
        if: steps.filter.outputs.frontend == 'true'
        run: cd frontend && bun install

      - name: create frontend env file
        if: steps.filter.outputs.frontend == 'true'
        run: echo "PUBLIC_API_URL=http://localhost:8001" > frontend/.env

      - name: build skip list
        id: skip
        run: |
          SKIP_LIST=""
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            SKIP_LIST="no-commit-to-branch"
          fi
          if [[ "${{ steps.filter.outputs.backend }}" != "true" ]]; then
            SKIP_LIST="${SKIP_LIST:+$SKIP_LIST,}type-check,check-oauth-scope-universe"
          fi
          if [[ "${{ steps.filter.outputs.frontend }}" != "true" ]]; then
            SKIP_LIST="${SKIP_LIST:+$SKIP_LIST,}svelte-check,eslint,vitest"
          fi
          if [[ "${{ steps.filter.outputs.rust }}" != "true" ]]; then
            SKIP_LIST="${SKIP_LIST:+$SKIP_LIST,}cargo-check-moderation,cargo-check-transcoder"
          fi
          echo "list=$SKIP_LIST" >> $GITHUB_OUTPUT

      # a PR runs the hooks on the files it changes, as pre-commit does locally;
      # main still runs every hook on every file after the merge
      - name: list the files this PR changes
        id: changed
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          files="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate \
            --jq '.[] | select(.status != "removed") | .filename' 2> /dev/null || true)"
          count="$(printf '%s' "$files" | grep -c . || true)"
          # the API lists at most 3000 files; past that, or on any failure, check everything
          if [ "${count:-0}" -gt 0 ] && [ "$count" -lt 3000 ]; then
            echo "args=--files $(printf '%s' "$files" | tr '\n' ' ')" >> "$GITHUB_OUTPUT"
          fi

      - name: run pre-commit
        uses: j178/prek-action@v1
        with:
          extra-args: ${{ steps.changed.outputs.args || '--all-files' }}
        env:
          SKIP: ${{ steps.skip.outputs.list }}

      - name: prune uv cache
        if: always()
        run: uv cache prune --ci
