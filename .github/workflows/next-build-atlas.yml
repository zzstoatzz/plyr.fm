name: next build atlas

# Rebuilds next's /atlas map (next/scripts/build-atlas.py) from next alone:
# the corpus is next's public catalog, vectors live in next's postgres
# (plyr_index.track_embeddings), new or changed audio is embedded through the
# Modal CLAP endpoint, and the map is stored in plyr_index.atlas_snapshots,
# which the api serves as fm.plyr.unspecced.getAtlas. Nothing here reads the
# legacy python api or its database. While TURBOPUFFER_API_KEY exists, each
# run first copies any legacy vectors next doesn't have yet (matched by
# legacy_id), so the legacy catalog isn't embedded twice.
#
# a pull request that changes the builder gets a dry run instead: the map is
# built from the vectors already stored, nothing is written, and the job
# summary shows each sound's name before and after, with its evidence.

on:
  push:
    branches: [main]
    paths:
      - "next/scripts/build-atlas.py"
      - "next/scripts/atlas_labels.py"
      - "next/backend/migrations/0061_add_atlas.sql"
      - ".github/workflows/next-build-atlas.yml"
  pull_request:
    paths:
      - "next/scripts/build-atlas.py"
      - "next/scripts/atlas_labels.py"
      - ".github/workflows/next-build-atlas.yml"
  schedule:
    - cron: "37 9 * * *" # daily
  workflow_dispatch: {}

permissions:
  contents: read
  # a push waits for that commit's next deploy (migrations, grants) to land
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: next-build-atlas-${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
      - name: wait for this commit's next deploy
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for i in $(seq 1 90); do
            state="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy-next.yml/runs?head_sha=$GITHUB_SHA" \
              --jq '.workflow_runs[0] | select(.) | .status + " " + (.conclusion // "")')"
            case "$state" in
              "completed success") exit 0 ;;
              completed*) echo "next deploy for $GITHUB_SHA: $state"; exit 1 ;;
              "") if [ "$i" -gt 6 ]; then echo "no next deploy for this commit"; exit 0; fi ;;
            esac
            sleep 20
          done
          echo "next deploy for $GITHUB_SHA didn't finish"; exit 1
      - name: embed new audio and build the map
        env:
          DATABASE_URL: ${{ secrets.ZIG_NEXT_WRITER_DATABASE_URL }}
          TURBOPUFFER_API_KEY: ${{ secrets.TURBOPUFFER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          flags=()
          if [ "${{ github.event_name }}" = pull_request ]; then
            flags=(--dry-run)
          elif [ -n "$TURBOPUFFER_API_KEY" ]; then
            flags=(--seed-turbopuffer)
          fi
          uv run next/scripts/build-atlas.py "${flags[@]}"
