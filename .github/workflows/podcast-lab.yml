# render status-podcast candidates from a spec on any branch, for listening
# before a change reaches the status-maintenance pipeline. a spec with
# "publish" also stages that variant as status-audio-<branch>, which
# status-maintenance uploads to plyr.fm when a PR labeled status-episode merges.
name: podcast lab

on:
  # a push that changes a lab spec or script renders it, on any branch but main
  push:
    branches-ignore: [main]
    paths:
      - "scripts/podcast_lab/**"
      - "scripts/podcast_lab.py"
      - "scripts/generate_tts.py"
      - ".github/workflows/podcast-lab.yml"
  workflow_dispatch:
    inputs:
      spec:
        description: "path to the lab spec JSON on the dispatched ref"
        type: string
        default: "scripts/podcast_lab/spec.json"

jobs:
  render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: Render candidates
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          SPEC: ${{ inputs.spec || 'scripts/podcast_lab/spec.json' }}
        run: uv run scripts/podcast_lab.py "$SPEC" lab-out

      - name: Encode mp3s
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg >/dev/null
          for wav in lab-out/*.wav; do
            ffmpeg -loglevel error -y -i "$wav" -codec:a libmp3lame -q:a 2 "${wav%.wav}.mp3"
            printf '%s %ss\n' "$(basename "$wav")" "$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$wav")"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: podcast-lab-${{ github.run_id }}
          path: |
            lab-out/*.mp3
            lab-out/*.txt
            lab-out/voices.json
          if-no-files-found: error
          retention-days: 14

      - name: Name the episode artifact
        id: episode
        if: hashFiles('lab-out/episode/update.wav') != ''
        run: echo "name=status-audio-${GITHUB_REF_NAME//\//-}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.episode.outputs.name
        with:
          name: ${{ steps.episode.outputs.name }}
          path: lab-out/episode/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
