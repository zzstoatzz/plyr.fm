name: deploy next processing

# Next's upload processing executor (next/services/processing). It is a
# Next-owned Fly app; nothing here touches the legacy transcoder or production.

on:
  pull_request:
    paths:
      - "next/services/processing/**"
      - ".github/workflows/deploy-next-processing.yml"
  push:
    branches: [main]
    paths:
      - "next/services/processing/**"
      - ".github/workflows/deploy-next-processing.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency: deploy-next-processing-${{ github.ref }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next/services/processing
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.17.0
      # every dependency is a tangled.org archive; keep the fetched packages
      # so a tangled outage cannot fail a build whose deps have not changed
      - uses: actions/cache@v4
        with:
          path: next/services/processing/zig-pkg
          key: processing-zig-pkg-${{ hashFiles('next/services/processing/build.zig.zon') }}
          restore-keys: processing-zig-pkg-
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: zig fmt --check build.zig src
      - run: zig build test --summary all
      - run: zig build fuzz -Dhegel -Dfuzz-cases=500

  deploy:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_PROCESSING_NEXT }}
      PROCESSING_TOKEN: ${{ secrets.PLYR_NEXT_PROCESSING_AUTH_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy
        working-directory: next/services/processing
        run: |
          test -n "$FLY_API_TOKEN"
          test -n "$PROCESSING_TOKEN"
          printf 'NEXT_PROCESSING_AUTH_TOKEN=%s\n' "$PROCESSING_TOKEN" | flyctl secrets import --stage --app plyr-next-processing
          flyctl deploy --remote-only --ha=false --app plyr-next-processing .
          flyctl scale count 1 --app plyr-next-processing --region iad --yes
      - name: verify health and authentication
        run: |
          curl -fsS https://plyr-next-processing.fly.dev/health
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'content-type: application/json' -d '{}' https://plyr-next-processing.fly.dev/v1/processing)
          echo "unauthenticated dispatch: $status"
          test "$status" = 401 -o "$status" = 422 -o "$status" = 400

  # a real processed upload through the deployed executor, with the
  # disposable integration account; the fixture cleans up its own objects
  # and record. One at a time.
  verify:
    needs: deploy
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: next-processing-acceptance
    defaults:
      run:
        working-directory: next/services/audio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: next/services/audio/package-lock.json
      - run: npm ci
      - uses: oven-sh/setup-bun@v2
      - name: install fixture SDK
        working-directory: next
        run: bun install --frozen-lockfile
      - name: install media verification tools
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ffmpeg
      - name: verify a processed upload end to end
        env:
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERIFY_UPLOAD_PROCESSING: "true"
        run: node --experimental-strip-types scripts/verify-upload.mjs
      - name: retain acceptance and cleanup receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: processing-acceptance
          path: next/services/audio/upload-acceptance
          retention-days: 3
          if-no-files-found: ignore
