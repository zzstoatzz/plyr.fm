name: next space stream

on:
  pull_request:
    paths:
      - "next/services/space-stream/**"
      - ".github/workflows/next-space-stream.yml"
  push:
    branches: [main]
    paths:
      - "next/services/space-stream/**"
      - ".github/workflows/next-space-stream.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: next/services/space-stream
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bunx wrangler deploy --dry-run
      # a merge ships the feed, like the rest of next; it was deployed by hand before
      - name: deploy
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bunx wrangler deploy
