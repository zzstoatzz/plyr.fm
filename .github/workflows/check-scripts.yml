name: check scripts

# the status podcast's renderer and the workflow's secret boundary have unit
# tests; nothing ran them.

on:
  pull_request:
    paths:
      - "scripts/generate_tts*.py"
      - "scripts/tests/**"
      - ".github/workflows/status-maintenance.yml"
      - ".github/workflows/check-scripts.yml"
  workflow_dispatch:

concurrency:
  group: check-scripts-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: script tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v7

      - name: unit tests
        run: uv run --python 3.12 --with google-genai==2.25.0 python -m unittest discover -s scripts/tests -v
