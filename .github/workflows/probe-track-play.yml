name: probe track play
on:
  push:
    branches: [probe/track-play]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
        working-directory: next
      - run: bun run playwright install --with-deps webkit chromium
        working-directory: next/web
      - working-directory: next/web
        env:
          ZAT_TEST_HANDLE: ${{ secrets.ZAT_TEST_HANDLE }}
          ZAT_TEST_PASSWORD: ${{ secrets.ZAT_TEST_PASSWORD }}
          ZAT_TEST_PDS: ${{ secrets.ZAT_TEST_PDS }}
        run: mkdir -p /tmp/probe && node scripts/probe-track-play.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: probe, path: /tmp/probe, if-no-files-found: ignore }
