name: deploy radio syndication

on:
  workflow_dispatch:

concurrency: deploy-radio-syndication

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: deploy catalog-only sister-radio gateway
        working-directory: services/radio
        run: flyctl deploy --config fly.toml --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_RADIO }}
