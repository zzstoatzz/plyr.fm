app = "plyr-radio"
primary_region = "ord"

[build]
  dockerfile = "Dockerfile"

[env]
  BIND_ADDR = "0.0.0.0:3000"
  DATABASE_URL = "sqlite:///app/data/radio.db"
  AUDIO_DIR = "/app/data/audio"
  APP_URL = "https://radio.plyr.fm"
  FRONTEND_URL = "https://plyr.fm/radio"
  SERVICE_DID = "did:web:radio.plyr.fm"
  SERVICE_ENDPOINT = "https://radio.plyr.fm"
  STATION_URL = "https://radio.plyr.fm"
  STATION_NAME = "plyr.fm · loved"
  SYNDICATION_DOMAIN = "radio.plyr.fm"
  STATION_ANNOUNCE_ON_STARTUP = "true"
  STATION_ANNOUNCE_RELAYS = "https://relay.fire.hose.cam"
  STATION_ANNOUNCE_WORKERS = "https://syndication.sharkgirl.pet"
  ADMIN_DIDS = ""

[[mounts]]
  source = "radio_data"
  destination = "/app/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
