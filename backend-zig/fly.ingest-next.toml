# Relay-to-projection ingester for next.plyr.fm. Same image as
# plyr-api-zig-canary, separate app so its write credential
# (WORKER_DATABASE_URL, the next branch owner) never reaches the api.
# It subscribes to the relay firehose, watches every repository that has a
# fm.plyr.stg.* record, and verifies commits into plyr_index on the next-zig
# Neon branch only.
app = "plyr-ingest-zig-next"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  MODE = "ingester"
  INDEX_MODE = "required"
  DATABASE_POOL_SIZE = "4"
  INGEST_RELAY_HOSTS = "wss://bsky.network"
  INGEST_RELAY_NAME = "bsky.network"
  TRACK_COLLECTION_NSID = "fm.plyr.stg.track"
  LIST_COLLECTION_NSID = "fm.plyr.stg.list"
  LIKE_COLLECTION_NSID = "fm.plyr.stg.like"
  PROFILE_COLLECTION_NSID = "fm.plyr.stg.actor.profile"

# no [http_service]: this is a single always-on worker, not a web service.

[[restart]]
  policy = "always"

[[vm]]
  cpu_kind = "shared"
  cpus = 2
  memory = "1gb"
