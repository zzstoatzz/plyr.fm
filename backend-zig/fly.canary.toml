app = "plyr-api-zig-canary"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  CORS_ALLOWED_ORIGINS = "https://next.plyr.fm"
  DATABASE_ROLE = "plyr_zig_canary"
  DATABASE_POOL_SIZE = "16"
  INDEX_MODE = "required"
  LIST_COLLECTION_NSID = "fm.plyr.list"
  LIKE_COLLECTION_NSID = "fm.plyr.like"
  PROFILE_COLLECTION_NSID = "fm.plyr.actor.profile"
  MAX_CONNECTIONS = "128"
  MODE = "api"
  PORT = "8000"
  TRACK_COLLECTION_NSID = "fm.plyr.track"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    soft_limit = 96
    hard_limit = 128

  [[http_service.checks]]
    interval = "10s"
    timeout = "2s"
    grace_period = "5s"
    method = "GET"
    path = "/ready"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
